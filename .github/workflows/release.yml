name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_publish:
        description: Tag and create a release from the configured version on main
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: CompeyDev/setup-rokit@1d9390883f7ebce19d48f5b8d006e11d387c92ab # v0.2.1
        with:
          version: v1.2.0

      - name: Install packages
        run: lute run install

      - name: Build
        run: lute run build --channel prod

      - id: changewrite
        uses: flipbook-labs/changewrite@v0.3.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          force-publish: ${{ inputs.force_publish || false }}
          base: main
          branch: publish-next-version
          post-publish-hook: |
            wally login --token "$WALLY_REGISTRY_TOKEN"
            wally publish
          pr-title: Publish v{{version}}
          pr-body: |
            >[!IMPORTANT]
            > This PR prepares the next release by bumping the version and updating the changelog.
            >
            > **Merging this PR will:**
            >
            > 1. Create and push tag `{{tag}}`
            > 2. Create a GitHub release for that tag
            > 3. Publish the package to Wally

            <details>
            <summary><b>GitHub Release preview</b></summary>

            # {{tag}}

            {{notes}}
            </details>

            Next release will be available here:
            {{repo_url}}/releases/tag/{{tag}}

            This PR was generated by [this run]({{run_url}}).
        env:
          WALLY_REGISTRY_TOKEN: ${{ secrets.WALLY_REGISTRY_TOKEN }}
