name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: CompeyDev/setup-rokit@1d9390883f7ebce19d48f5b8d006e11d387c92ab # v0.2.1
        with:
          version: v1.2.0

      - name: Install packages
        run: lute run install

      - name: Lint
        run: lute run lint

      - name: Check for any-casts in library source
        run: |
          if grep -rn ":: any" modules/*/src --include="*.luau" | grep -v "\.spec\.luau"; then
            echo "':: any' casts are not allowed in library source" >&2
            exit 1
          fi

      - name: Run Luau analysis
        run: |
          lute setup
          lute run analyze

  changelog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7

      - uses: flipbook-labs/changewrite@v0.5.0
        with:
          require-entry: 'true'

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: CompeyDev/setup-rokit@1d9390883f7ebce19d48f5b8d006e11d387c92ab # v0.2.1
        with:
          version: v1.2.0

      - name: Install packages
        run: lute run install

      - name: Load secrets from 1Password
        uses: 1Password/load-secrets-action@dafbe7cb03502b260e2b2893c753c352eee545bf # v3
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          # Item "Flipbook CI (Open Cloud)" — referenced by ID because its
          # parenthesized title breaks op:// reference parsing.
          ROBLOX_API_KEY: op://Flipbook/7c2b4vowqat6feao5x3nm7cwom/password

      - name: Run tests
        run: lute run test
